[env:esp32s3_tft_watch] ; Đổi tên môi trường cho rõ ràng (tùy chọn)
platform = espressif32
board = adafruit_feather_esp32s3_tft ; <<< THAY ĐỔI: Board ESP32-S3 theo gợi ý tài liệu
framework = arduino
upload_port = COM5         ; Giữ nguyên cổng COM của bạn
monitor_speed = 921600     ; Giữ nguyên tốc độ Serial

lib_deps =
    ; --- Thư viện giữ lại ---
    h2zero/NimBLE-Arduino@^1.4.0                     ; BLE
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2 ; MAX30102
    bblanchon/ArduinoJson@^6.21.3                    ; JSON
    bodmer/TFT_eSPI@^2.5.0                           ; Màn hình TFT
    mathertel/OneButton @ ^2.0.3                     ; Xử lý nút bấm
    ; --- Thư viện mới cần THÊM ---
    https://github.com/lewisxhe/SensorLib.git
    adafruit/Adafruit BMP280 Library @ ^2.2.2
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    adafruit/Adafruit BusIO @ ^1.14.1

build_flags =
    -D COMPRESS_FW ; Có thể giữ hoặc bỏ nếu không cần nén firmware
    -Os
    -I include/
    ; PlatformIO thường tự định nghĩa macro board, nhưng có thể thêm nếu cần debug:
    ; -D ARDUINO_ADAFRUIT_FEATHER_ESP32S3_TFT